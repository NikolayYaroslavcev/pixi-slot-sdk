<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" width="300" height="132">
<title>Bonus Buy plate</title>
<!-- Drawn at exactly the button's size (game.config.ts, extraButtons), so the nine-slice never
     squeezes it; assets.ts loads it at double resolution to stay sharp. -->
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff7c9"/><stop offset=".25" stop-color="#ffd862"/><stop offset=".55" stop-color="#c9801a"/><stop offset=".72" stop-color="#ffe08a"/><stop offset="1" stop-color="#7a3a08"/></linearGradient>
<linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff6a4a"/><stop offset=".35" stop-color="#cf1f28"/><stop offset=".8" stop-color="#860a13"/><stop offset="1" stop-color="#560509"/></linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#140702"/><stop offset=".6" stop-color="#341707"/><stop offset="1" stop-color="#4e250d"/></linearGradient>
<radialGradient id="coin" cx=".38" cy=".35" r=".7"><stop stop-color="#fff3a8"/><stop offset=".45" stop-color="#ffc83a"/><stop offset="1" stop-color="#a85a0a"/></radialGradient>
</defs>
<rect x="4" y="8" width="292" height="122" rx="61" fill="#000" opacity=".45"/>
<rect x="3" y="3" width="294" height="122" rx="61" fill="#1d0c06"/>
<rect x="6" y="6" width="288" height="116" rx="58" fill="url(#gold)"/>
<rect x="7" y="7" width="286" height="114" rx="57" fill="none" stroke="#fff3b8" stroke-opacity=".7"/>
<rect x="12" y="12" width="276" height="104" rx="52" fill="url(#lacquer)" stroke="#3a0406" stroke-width="2"/>
<path d="M40 16h220q22 0 30 16H10q8-16 30-16z" fill="#fff" fill-opacity=".16"/>
<rect x="46" y="59" width="208" height="48" rx="24" fill="url(#plate)" stroke="#ffd862" stroke-width="2.5"/>
<path d="M60 62h180" stroke="#000" stroke-opacity=".5" stroke-width="3"/>
<g stroke="#5a2806" stroke-width="2">
<circle cx="29" cy="64" r="12" fill="url(#coin)"/>
<circle cx="271" cy="64" r="12" fill="url(#coin)"/>
</g>
<g fill="#8a480b">
<path d="M29 56l2.4 5.4 5.6.4-4.3 3.7 1.4 5.6-5.1-3.1-5.1 3.1 1.4-5.6-4.3-3.7 5.6-.4z"/>
<path d="M271 56l2.4 5.4 5.6.4-4.3 3.7 1.4 5.6-5.1-3.1-5.1 3.1 1.4-5.6-4.3-3.7 5.6-.4z"/>
</g>
</svg>
